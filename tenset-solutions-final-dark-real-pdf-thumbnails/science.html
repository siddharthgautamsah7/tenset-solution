<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science — Tenset Solutions</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="brand"><a class="logo" href="index.html">TS</a><div><h1>Tenset Solutions</h1><p>Learn smarter. Prepare better.</p></div></div><nav><a href="index.html">Home</a><a href="#">Solutions</a></nav></header><main><section class="solutions-hero"><a class="back" href="index.html">← Back to subjects</a><span class="eyebrow">SUBJECT</span><h2>Science</h2><p>Available solution PDFs</p><div class="search-wrap"><input id="search" type="search" placeholder="Search solutions..."></div></section><section class="pdf-section"><div id="status" class="status">Loading solutions...</div><div id="pdf-grid" class="pdf-grid"></div></section></main><footer><span>© 2026 Tenset Solutions</span><span>Study with purpose.</span></footer><script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
const SUBJECT="science",grid=document.getElementById("pdf-grid"),status=document.getElementById("status"),search=document.getElementById("search");let items=[];
fetch("solutions.json").then(r=>{if(!r.ok)throw Error("solutions.json");return r.json()}).then(d=>{items=d[SUBJECT]||[];render(items)}).catch(e=>{console.error(e);status.textContent="Could not load solutions.json.";});
function render(list){grid.innerHTML="";status.textContent=list.length?list.length+" solution"+(list.length>1?"s":"")+" available":"No solutions added yet.";list.forEach((x,i)=>{const c=document.createElement("a");c.className="pdf-card";c.href=x.file;c.target="_blank";c.rel="noopener";c.innerHTML='<div class="thumb"><canvas id="canvas-'+i+'"></canvas><div class="pdf-loading" id="load-'+i+'">Loading preview…</div></div><div class="pdf-info"><h3>'+esc(x.title)+'</h3><span>Open solution →</span></div>';grid.appendChild(c);makeThumb(x.file,document.getElementById("canvas-"+i),document.getElementById("load-"+i));});}
async function makeThumb(url,canvas,label){try{const pdf=await pdfjsLib.getDocument({url:url}).promise;const page=await pdf.getPage(1);const base=page.getViewport({scale:1});const scale=Math.min(500/base.width,430/base.height);const vp=page.getViewport({scale});canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;label.remove();}catch(e){console.error("Thumbnail:",url,e);label.className="pdf-error";label.textContent="Preview unavailable — click to open PDF";}}
search.addEventListener("input",()=>{const q=search.value.toLowerCase().trim();render(items.filter(x=>String(x.title).toLowerCase().includes(q)))});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
